name: chemimg310
channels:
  - conda-forge
  - defaults

dependencies:
  # --- Core language ---
  - python=3.10

  # --- Chemistry ---
  # Pin RDKit explicitly (API + depiction stability)
  - rdkit=2025.03.6

  # --- Numerics ---
  - numpy>=2.2,<2.3
  - tqdm>=4.67

  # --- Imaging & plotting ---
  - pillow>=12.0
  - matplotlib>=3.10

  # --- Cairo stack (important for SVG/PNG rendering) ---
  # Cairo is best handled by conda, CairoSVG via pip
  - cairo=1.18.*
  - pip

  # --- Pip-only dependencies ---
  - pip:
      - cairosvg==2.8.2
